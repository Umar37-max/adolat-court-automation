; ADOLAT AVTOMAT - example settings file.
; Copy to "sozlamalar.ini" next to adolat_avtomat.py (or the .exe) and fill in your own values.
; The real sozlamalar.ini is git-ignored. The app writes missing keys into it on first start.
;
; sayt                    - kabinet manzili
; login                   - ONE ID login
; parol                   - ONE ID paroli. Shu yerga yozsangiz, dastur birinchi ishga tushganda
;                           uni shifrlab (Windows DPAPI) parol.dat ga oladi va bu yerdan O'CHIRADI.
;                           Bo'sh qoldirsangiz, bir marta so'raladi. (Yoki ADOLAT_PAROL muhit o'zgaruvchisi.)
; profil_stir             - kirgandan keyin tanlanadigan tashkilot STIRi
; sud_hammaga_toshkent    - Ha: HAMMA mijozlar - Toshkent shahar, "sud" dagi sud;
;                           Yo'q: da'vo arizada yozilgan sud, yozilmagan bo'lsa - javobgar manzili bo'yicha
; viloyat / sud           - sudlar jadvali (Fuqarolik_sudlari_yurisdiksiya.xlsx) yo'q bo'lsa shu tanlanadi
; asosiy_davogar          - "Da'vogar nomi" ro'yxatidan tanlanadigan tashkilot
; qoshimcha_davogar_stir  - STIR orqali qo'shiladigan da'vogar (bo'sh bo'lsa qo'shilmaydi)
; qoshimcha_davogar_belgi - STIR qidiruvi natijasida chiqishi kerak bo'lgan so'z
; nizo_turi, ariza_turi, ish_turkumi, qoshimcha_ish_turkumi - 2-qadam ro'yxatlari
; davlat_boji_imtiyozi    - 4-qadam "To'lov imtiyozi" ro'yxatidan tanlanadigan variant (bo'sh - tanlanmaydi)
; kutish_soniya           - sayt sekin bo'lsa oshiring
; tezlik                  - Tez / O'rtacha / Sekin / Qo'lda (Qo'lda - quyidagi pauzalar qanday yozilgan bo'lsa)
; pauza_min / pauza_max   - har bir bosishdan keyingi tasodifiy pauza (soniya)
; harf_pauza              - yozishda har bir harf orasidagi o'rtacha pauza (soniya)
; kechikish_koef          - qat'iy kutishlar ko'paytiruvchisi: 1 = sekin, 0.5 = 2 marta tezroq
; mijozlar_orasida        - bir mijozdan keyingisiga o'tishdagi dam (soniya)
; ocr_avto                - Ha: qo'lda yozilgan raqam/sanani OCR ishonchli o'qisa - tasdiqsiz ishlanadi
; ocr_ishonch             - OCR natijasi avtomatik qabul qilinadigan eng kam ishonch (0.90 = 90%)
; yuborishdan_oldin_sorash - Ha: har ariza sudga yuborilishidan oldin so'raladi
; xatoda_kutish           - 0: xato bo'lsa so'ramasdan keyingi mijoz; 30 kabi son - shuncha soniya qo'lda tuzatish kutiladi
; kvitansiya_*            - alohida dastur kvitansiya_yaratish.py (billing.sud.uz) sozlamalari;
;                           u o'z papkasidagi kvitansiya_sozlamalar.ini dan o'qiydi (kalitlari bir xil)
